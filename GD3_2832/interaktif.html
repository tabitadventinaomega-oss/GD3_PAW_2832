<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Halaman Interaktif Saya</title>
    <link rel="stylesheet" hre="style.css" />
    <a href="profil.html" onclick="navigasi(event, this)">Profil</a>
    <a href="form.html" onclick="navigasi(event, this)">Form</a>
  </head>

  <body>
    <h1 id="judulHalaman">Halaman Interaktif Saya</h1>

    <script>
      const judul = document.getElementById("judulHalaman");
      judul.style.color = "red";
      console.log(judul.innerHTML);

      function sapa(nama) {
        return "Halo, " + nama + "!";
      }
      console.log(sapa("Tabita"));

      function ubahBiru() {
        const teks = document.getElementById("teks");
        teks.style.color = "blue";
      }

      function tampilkanNama() {
        const nama = document.getElementById("inputNama").value;
        if (nama == "") {
          alert("Silahkan isi nama dulu.");
        } else {
          alert("Halo, " + nama + "!");
        }
      }

      function hitungKuadrat() {
        const angka = document.getElementById("angka").value;
        const hasil = angka * angka;

        document.getElementById("hasil").innerHTML = "Hasil kuadrat: " + hasil;
      }

      function navigasi(event, element) {
        event.preventDefault();

        const yakin = confirm("Apakah Anda yakin ingin pindah halaman?");

        if (yakin) {
          console.log("Navigasi ke: ", element.href);
          window.location.href = element.href;
        }
      }
    </script>

    <p id="teks">Teks ini bisa berubah!!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>

    <input type="text" id="inputNama" />
    <button onclick="tampilkanNama()">Tampilkan</button>

    <h2>Hitung Kuadrat</h2>

    <label for="angka">Masukkan angka:</label>
    <input type="number" id="angka" />

    <button onclick="hitungKuadrat()">Hitung</button>
    <p id="hasil"></p>
  </body>
</html>
